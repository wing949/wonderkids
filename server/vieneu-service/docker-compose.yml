version: '3.8'

services:
  vieneu-tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wonderkids-vieneu-tts
    ports:
      - "8000:8000"
    volumes:
      - vieneu_cache:/app/.audio_cache
    restart: unless-stopped
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1

volumes:
  vieneu_cache:
